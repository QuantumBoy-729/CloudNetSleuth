services:
  log-ingestor:
    build: ./services/log-ingestor
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8081/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  rca-service:
    build: ./services/rca-service
    ports: ["8080:8080"]
    environment:
      RCA_INGESTOR_URL: http://log-ingestor:8081
      RCA_POLL_INTERVAL_SECONDS: "5"
      RCA_WINDOW_SECONDS: "30"
    depends_on:
      log-ingestor: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  log-simulator:
    build: ./services/log-simulator
    environment:
      SIM_INGESTOR_URL: http://log-ingestor:8081
      SIM_INTERVAL_SECONDS: "1"
      SIM_FAULT_PERIOD_TICKS: "90"
      SIM_FAULT_DURATION_TICKS: "40"
    depends_on:
      log-ingestor: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [log-ingestor, rca-service]

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cloudnetsleuth.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

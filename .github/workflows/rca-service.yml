name: rca-service

on:
  push:
    branches: [sleuthDev]
    paths:
      - "services/rca-service/**"
      - ".github/workflows/rca-service.yml"
  pull_request:
    paths:
      - "services/rca-service/**"
      - ".github/workflows/rca-service.yml"

defaults:
  run:
    working-directory: services/rca-service

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/rca-service/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: pytest

  image:
    name: Build container image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t cloudnetsleuth/rca-service:${{ github.sha }} .

      - name: Verify the image runs as a non-root user
        run: |
          uid=$(docker run --rm --entrypoint id cloudnetsleuth/rca-service:${{ github.sha }} -u)
          test "$uid" = "1001" || { echo "expected uid 1001, got $uid"; exit 1; }

      - name: Smoke test the health endpoint
        run: |
          docker run -d --name rca -p 8080:8080 cloudnetsleuth/rca-service:${{ github.sha }}
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health/ready; then
              docker rm -f rca
              exit 0
            fi
            sleep 1
          done
          docker logs rca
          docker rm -f rca
          exit 1
